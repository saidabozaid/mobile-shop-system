<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة محل الموبايلات والصيانة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .nav-pills .nav-link.active { background-color: #0d6efd; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">📱 نظام إدارة محل الموبايلات والصيانة</span>
    </div>
</nav>

<div class="container">
    <ul class="nav nav-pills nav-justified mb-4" id="mainTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="pos-tab" data-bs-toggle="tab" data-bs-target="#pos" type="button">🛒 نقطة البيع (POS)</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="inventory-tab" data-bs-toggle="tab" data-bs-target="#inventory" type="button">📦 المخزون والـ IMEI</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="maintenance-tab" data-bs-toggle="tab" data-bs-target="#maintenance" type="button">🛠️ مركز الصيانة</button>
        </li>
    </ul>

    <div class="tab-content" id="mainTabContent">
        <!-- قسم نقطة البيع -->
        <div class="tab-pane fade show active" id="pos">
            <div class="card p-4">
                <h4>نقطة البيع الفورية</h4>
                <div class="row g-3 my-2">
                    <div class="col-md-8">
                        <input type="text" id="barcodeInput" class="form-control form-control-lg" placeholder="امسح الباركود أو أدخل الـ IMEI هنا...">
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-primary btn-lg w-100">إضافة للفاتورة</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- قسم المخزون والـ IMEI -->
        <div class="tab-pane fade" id="inventory">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>إدارة المنتجات والأجهزة</h4>
                    <button class="btn btn-success">+ إضافة منتج جديد</button>
                </div>
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>الباركود / IMEI</th>
                            <th>سعر الشراء</th>
                            <th>سعر البيع</th>
                            <th>الكمية</th>
                        </tr>
                    </thead>
                    <tbody id="productsList">
                        <tr><td colspan="5" class="text-center text-muted">لا يوجد منتجات مضافة حتى الآن</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- قسم الصيانة -->
        <div class="tab-pane fade" id="maintenance">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4>تذاكر الصيانة والجيل</h4>
                    <button class="btn btn-warning text-dark">+ كارت صيانة جديد</button>
                </div>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>رقم التذكرة</th>
                            <th>اسم العميل</th>
                            <th>نوع الجهاز</th>
                            <th>العطل</th>
                            <th>التكلفة</th>
                            <th>الحالة</th>
                        </tr>
                    </thead>
                    <tbody id="maintenanceList">
                        <tr><td colspan="6" class="text-center text-muted">لا يوجد طلبات صيانة حالية</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
